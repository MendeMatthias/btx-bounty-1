<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="760" height="470" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Money -->
  <rect x="24" y="40" width="170" height="78" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="109" y="68" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">easyBTX (Mende)</text>
  <text x="109" y="90" text-anchor="middle" font-size="13" fill="#334155">puts in 5 BTX</text>
  <text x="109" y="108" text-anchor="middle" font-size="11" fill="#64748b">others may add lots</text>

  <line x1="194" y1="79" x2="276" y2="79" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <rect x="280" y="24" width="200" height="110" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="380" y="52" text-anchor="middle" font-size="15" font-weight="700" fill="#065f46">Locked on the BTX chain</text>
  <text x="380" y="74" text-anchor="middle" font-size="12" fill="#065f46">an escrow output with</text>
  <text x="380" y="91" text-anchor="middle" font-size="12" fill="#065f46">exactly two ways out.</text>
  <text x="380" y="114" text-anchor="middle" font-size="11" fill="#047857">Nobody else can move it.</text>

  <!-- Award path -->
  <line x1="480" y1="60" x2="556" y2="60" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <rect x="560" y="22" width="176" height="78" rx="10" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="648" y="47" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">1. Award</text>
  <text x="648" y="67" text-anchor="middle" font-size="12" fill="#1e40af">the council signs,</text>
  <text x="648" y="84" text-anchor="middle" font-size="12" fill="#1e40af">the winner is paid</text>

  <!-- Refund path -->
  <line x1="480" y1="104" x2="556" y2="138" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <rect x="560" y="112" width="176" height="78" rx="10" fill="#fff7ed" stroke="#f97316"/>
  <text x="648" y="137" text-anchor="middle" font-size="14" font-weight="700" fill="#7c2d12">2. Refund</text>
  <text x="648" y="157" text-anchor="middle" font-size="12" fill="#9a3412">nobody won: back to</text>
  <text x="648" y="174" text-anchor="middle" font-size="12" fill="#9a3412">Mende, no one's help</text>

  <!-- Timeline -->
  <text x="24" y="236" font-size="14" font-weight="700" fill="#0f172a">About seven weeks, counted in blocks (about 960 a day)</text>
  <line x1="40" y1="290" x2="730" y2="290" stroke="#94a3b8" stroke-width="3"/>
  <g font-size="11" fill="#334155" text-anchor="middle">
    <circle cx="40" cy="290" r="6" fill="#0f172a"/><text x="40" y="272" font-weight="700">day 0</text><text x="40" y="312">terms</text><text x="40" y="326">published,</text><text x="40" y="340">money locked</text>
    <circle cx="138" cy="290" r="6" fill="#0f172a"/><text x="138" y="272" font-weight="700">day 7</text><text x="138" y="312">no more</text><text x="138" y="326">money added</text>
    <circle cx="434" cy="290" r="6" fill="#0f172a"/><text x="434" y="272" font-weight="700">day 28</text><text x="434" y="312">no more</text><text x="434" y="326">submissions</text>
    <circle cx="532" cy="290" r="6" fill="#0f172a"/><text x="532" y="272" font-weight="700">day 35</text><text x="532" y="312">scores</text><text x="532" y="326">published</text>
    <rect x="546" y="284" width="84" height="12" rx="6" fill="#3b82f6"/><text x="600" y="254" font-weight="700" fill="#1e3a8a">days 36 to 42</text><text x="588" y="312" fill="#1e40af">award window</text>
    <circle cx="730" cy="290" r="6" fill="#f97316"/><text x="716" y="272" font-weight="700" fill="#7c2d12">day 49</text><text x="716" y="312" fill="#9a3412">refund opens</text>
  </g>

  <!-- Who does what -->
  <g font-size="12" fill="#334155">
    <text x="24" y="384" font-size="14" font-weight="700" fill="#0f172a">Who does what</text>
    <text x="24" y="406"><tspan font-weight="700" fill="#0f172a">Builders</tspan> (anyone): send a model's btx:// link before day 28.</text>
    <text x="24" y="426"><tspan font-weight="700" fill="#0f172a">Evaluators:</tspan> ask each model the same 60 questions and publish every answer.</text>
    <text x="24" y="446"><tspan font-weight="700" fill="#0f172a">Council</tspan> (3 people): sign the award for the highest score of 48 or more.</text>
  </g>
</svg>
